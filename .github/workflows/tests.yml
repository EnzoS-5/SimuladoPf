name: Testes
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avaliacoes_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d avaliacoes_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RUN_POSTGRES_TESTS: 'true'
      IT_DB_URL: jdbc:postgresql://localhost:5432/avaliacoes_test
      IT_DB_USER: test
      IT_DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-backend
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
