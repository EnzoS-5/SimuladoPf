spring.application.name=Simulado
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simuladopf}
spring.datasource.username=${DB_USER:simulado}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
app.auth0.audience=${AUTH0_AUDIENCE}
app.auth0.roles-claim=${AUTH0_ROLES_CLAIM:https://social-insper.com/roles}
app.auth0.email-claim=${AUTH0_EMAIL_CLAIM:https://social-insper.com/email}
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5173}
