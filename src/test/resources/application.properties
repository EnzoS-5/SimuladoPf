spring.datasource.url=jdbc:h2:mem:avaliacoes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.test/
app.auth0.audience=https://api.test
app.auth0.roles-claim=https://social-insper.com/roles
app.auth0.email-claim=https://social-insper.com/email
app.frontend-origins=http://localhost:5173
